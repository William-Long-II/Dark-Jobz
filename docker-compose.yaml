services:
  dark_jobz_postgres:
    image: postgres
    container_name: dark_jobz_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/dark_jobz_data
volumes:
  pgdata:
